[[package]]
name = "smartmeter"
version = "0.1.0"
source = { virtual = "." }

[package.optional-dependencies]
api = [
    { name = "smartmeter-api" },
]
collector = [
    { name = "smartmeter-collector" },
]
full = [
    { name = "smartmeter-api" },
    { name = "smartmeter-collector" },
    { name = "smartmeter-utility" },
]
utility = [
    { name = "smartmeter-utility" },
]

[package.metadata]
requires-dist = [
    { name = "smartmeter-api", marker = "extra == 'api'", editable = "packages/smartmeter-api" },
    { name = "smartmeter-api", marker = "extra == 'full'", editable = "packages/smartmeter-api" },
    { name = "smartmeter-collector", marker = "extra == 'collector'", editable = "packages/smartmeter-collector" },
    { name = "smartmeter-collector", marker = "extra == 'full'", editable = "packages/smartmeter-collector" },
    { name = "smartmeter-utility", marker = "extra == 'full'", editable = "packages/smartmeter-utility" },
    { name = "smartmeter-utility", marker = "extra == 'utility'", editable = "packages/smartmeter-utility" },
]
provides-extras = ["api", "collector", "utility", "full"]

