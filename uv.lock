version = 1
revision = 1
requires-python = ">=3.11"

[manifest]
members = [
    "smartmeter",
    "smartmeter-api",
    "smartmeter-collector",
    "smartmeter-lib",
    "smartmeter-utility",
]

[[package]]
name = "pyserial"
version = "3.5"
source = { registry = "https://pypi.org/simple" }
sdist = { url = "https://files.pythonhosted.org/packages/1e/7d/ae3f0a63f41e4d2f6cb66a5b57197850f919f59e558159a4dd3a818f5082/pyserial-3.5.tar.gz", hash = "sha256:3c77e014170dfffbd816e6ffc205e9842efb10be9f58ec16d3e8675b4925cddb", size = 159125 }
wheels = [
    { url = "https://files.pythonhosted.org/packages/07/bc/587a445451b253b285629263eb51c2d8e9bcea4fc97826266d186f96f558/pyserial-3.5-py2.py3-none-any.whl", hash = "sha256:c4451db6ba391ca6ca299fb3ec7bae67a5c55dde170964c7a14ceefec02f2cf0", size = 90585 },
]

[[package]]
name = "smartmeter"
version = "0.1.0"
source = { virtual = "." }

[package.optional-dependencies]
api = [
    { name = "smartmeter-api" },
]
collector = [
    { name = "smartmeter-collector" },
]
full = [
    { name = "smartmeter-api" },
    { name = "smartmeter-collector" },
    { name = "smartmeter-utility" },
]
utility = [
    { name = "smartmeter-utility" },
]

[package.metadata]
requires-dist = [
    { name = "smartmeter-api", marker = "extra == 'api'", editable = "packages/smartmeter-api" },
    { name = "smartmeter-api", marker = "extra == 'full'", editable = "packages/smartmeter-api" },
    { name = "smartmeter-collector", marker = "extra == 'collector'", editable = "packages/smartmeter-collector" },
    { name = "smartmeter-collector", marker = "extra == 'full'", editable = "packages/smartmeter-collector" },
    { name = "smartmeter-utility", marker = "extra == 'full'", editable = "packages/smartmeter-utility" },
    { name = "smartmeter-utility", marker = "extra == 'utility'", editable = "packages/smartmeter-utility" },
]
provides-extras = ["api", "collector", "utility", "full"]

[[package]]
name = "smartmeter-api"
version = "0.1.0"
source = { editable = "packages/smartmeter-api" }
dependencies = [
    { name = "smartmeter-lib" },
]

[package.metadata]
requires-dist = [{ name = "smartmeter-lib", editable = "packages/smartmeter-lib" }]

[[package]]
name = "smartmeter-collector"
version = "0.1.0"
source = { editable = "packages/smartmeter-collector" }
dependencies = [
    { name = "pyserial" },
]

[package.metadata]
requires-dist = [{ name = "pyserial", specifier = ">=3.5" }]

[[package]]
name = "smartmeter-lib"
version = "0.1.0"
source = { editable = "packages/smartmeter-lib" }

[[package]]
name = "smartmeter-utility"
version = "0.1.0"
source = { editable = "packages/smartmeter-utility" }
